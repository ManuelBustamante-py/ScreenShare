<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
ScreenShare
</title>

<link
rel="stylesheet"
href="style.css"
/>

</head>

<body>

<div class="app-shell">

<header class="topbar">

<div class="brand-row">

<div>

<div class="eyebrow">
PLATAFORMA DE PANTALLA COMPARTIDA
</div>

<h1 class="logo">
ScreenShare
</h1>

<div class="room-meta">

<span class="live-dot"></span>

<p
id="roomStatus"
class="status-line"
>
Listo
</p>

</div>

</div>

</div>


<div class="controls-card">

<div class="controls-grid">

<input
id="nameInput"
type="text"
maxlength="32"
placeholder="Tu nombre"
/>

<input
id="roomInput"
type="text"
maxlength="12"
placeholder="Código sala"
/>

<button
id="host"
class="primary"
>
＋ Crear sala
</button>

<button
id="join"
class="secondary"
>
Entrar
</button>

</div>


<div
id="shareBox"
class="share-actions"
style="display:none"
>

<input
id="roomLink"
readonly
/>

<div class="share-buttons">

<button
id="copyBtn"
class="secondary"
>
🔗 Copiar
</button>

<button
id="shareBtn"
class="secondary"
>
📤 Compartir
</button>

</div>

</div>

</div>

</header>


<main class="workspace">

<section class="main-panel">

<div class="video-overlay">

<div class="overlay-chip">
🟢 En vivo
</div>

<div class="overlay-chip">
👥
<span id="participantCount">
0
</span>
</div>

</div>

<video
id="video"
autoplay
playsinline
controls
></video>

</section>



<aside
id="sidebar"
class="sidebar"
style="display:none"
>

<div class="sidebar-tabs">

<button
class="tab active"
data-tab="chat"
>
💬 Chat
</button>

<button
class="tab"
data-tab="participants"
>
👥 Participantes
</button>

</div>



<div
id="chatView"
class="sidebar-view active"
>

<div
id="chatMessages"
class="chat-messages"
>

<div class="empty-state">
Todavía no hay mensajes
</div>

</div>

<form
id="chatForm"
class="chat-form"
>

<input
id="chatInput"
maxlength="300"
placeholder="Escribe un mensaje..."
/>

<button
type="submit"
class="primary"
>
Enviar
</button>

</form>

</div>



<div
id="usersView"
class="sidebar-view"
>

<div
id="participantsList"
class="participants-list"
>

<div class="empty-state">
Sin participantes
</div>

</div>

</div>

</aside>

</main>

</div>



<script>

document
.querySelectorAll(".tab")
.forEach(btn=>{

btn.onclick=()=>{

document
.querySelectorAll(".tab")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

document
.querySelectorAll(".sidebar-view")
.forEach(v=>
v.classList.remove("active")
);

if(
btn.dataset.tab==="chat"
){

chatView.classList.add("active");

}
else{

usersView.classList.add("active");

}

};

});

</script>

<script
type="module"
src="app.js"
></script>

</body>

</html>
